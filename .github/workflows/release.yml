name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from package.json without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if (process.env.VERSION !== p.version) { console.error(`Requested ${process.env.VERSION}, package.json has ${p.version}`); process.exit(1); }'
      - name: Create release archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git archive --format=zip --output="cryox-gemini-drive-v${VERSION}.zip" HEAD
          sha256sum "cryox-gemini-drive-v${VERSION}.zip" > "cryox-gemini-drive-v${VERSION}.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          git rev-parse "$TAG" >/dev/null 2>&1 && { echo "$TAG already exists"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release $TAG already exists"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "cryox-gemini-drive-v${VERSION}.zip" \
            "cryox-gemini-drive-v${VERSION}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
