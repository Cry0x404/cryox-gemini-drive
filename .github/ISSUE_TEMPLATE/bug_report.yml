name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include session cookies, vault keys, private provider handles, or signed URLs."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
